<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141b" media="(prefers-color-scheme: dark)">
<meta name="description" content="Drag-and-drop after-school and weekend schedule planner.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<title>After-School Block Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app. Scrollable timeline pane on the left, block tray on the right; blocks drag sideways and snap to 15-minute rows. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#1b1f2a; --muted:#6a7186; --faint:#a3a9b8; --line:#e2e5ec; --grid:#eef0f4;
  --study:#4b63c8; --sport:#d8783a; --play:#8a63c0; --life:#3e8e77;
  --focus:#4b63c8; --danger:#c8483f; --ok:#3e8e77;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --u:24px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141b; --surface:#191d26; --ink:#eef0f5; --muted:#9aa1b4; --faint:#5f6678; --line:#2a2f3c; --grid:#20242e;
  --study:#5e77dc; --sport:#e0844a; --play:#9b76d2; --life:#4aa088; --focus:#7d93ee; --danger:#e2645b; --ok:#55b096; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11141b; --surface:#191d26; --ink:#eef0f5; --muted:#9aa1b4; --faint:#5f6678; --line:#2a2f3c; --grid:#20242e;
  --study:#5e77dc; --sport:#e0844a; --play:#9b76d2; --life:#4aa088; --focus:#7d93ee; --danger:#e2645b; --ok:#55b096; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;overscroll-behavior:none;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:560px){body{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
.wrap{max-width:940px;height:100%;max-height:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;flex-direction:column;min-width:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,5vw,28px);letter-spacing:-.02em;margin:0;line-height:1.05}
.savebar{display:flex;align-items:center;gap:10px}
.status{font-size:12px;color:var(--muted);text-align:right;line-height:1.2}
.status.dirty{color:var(--sport);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.ghosty{background:none;border-color:transparent;color:var(--muted);padding:4px 8px}
.btn.ghosty:hover{color:var(--ink)}
.btn.small{padding:4px 10px;font-size:12px}

/* Day switcher */
.dayrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.days{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.day{border:0;background:none;border-radius:999px;padding:5px 10px;font-weight:600;font-size:13px;color:var(--muted);position:relative}
.day[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.day.wkend{color:var(--faint)}
.day.wkend[aria-pressed="true"]{color:var(--surface)}
.day .dot{position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--ok)}
.tools{display:flex;gap:2px}
@media (max-width:430px){.day{padding:5px 7px;font-size:12px}}

.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px}
@media (min-width:700px){.main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-height:0;display:flex;flex-direction:column}

/* Board */
.board-head{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.dtitle{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dtitle h2{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0}
.range{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--grid);gap:2px}
.meter span{height:100%;border-radius:999px}
.mtext{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.mtext .legend{display:flex;gap:10px;flex-wrap:wrap}
.mtext i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.mtext b{color:var(--ink);font-weight:600}
.done{color:var(--ok);font-weight:600}
.pane{flex:1;min-height:0;overflow-y:auto;padding:14px 12px 16px 6px;overscroll-behavior:contain}
.timeline{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 8px}
.times{position:relative}
.times div{position:absolute;right:0;transform:translateY(-50%);font-variant-numeric:tabular-nums;white-space:nowrap}
.times .h{font-size:12px;font-weight:600;color:var(--ink)}
.times .h small{font-size:9px;font-weight:600;color:var(--muted);margin-left:2px;letter-spacing:.04em}
.times .hh{font-size:10.5px;color:var(--faint)}
.times .bed{font-size:11px;font-weight:600;color:var(--sport)}
.track{position:relative}
.slot{position:absolute;left:0;right:0;height:var(--u);border:0;background:none;padding:0 0 0 10px;text-align:left;color:var(--faint);font-size:11px;display:flex;align-items:center;border-top:1px solid transparent}
.slot.q30{border-top-color:var(--grid)}
.slot.q60{border-top-color:var(--line)}
.slot.hl{background:color-mix(in srgb,var(--ok) 16%,transparent)}
.slot.bad{background:color-mix(in srgb,var(--danger) 14%,transparent)}
.slot.tap{color:var(--muted)}
.bedline{position:absolute;left:0;right:0;border-top:2px solid var(--sport)}
.bedtag{position:absolute;right:0;transform:translateY(4px);font-size:11px;font-weight:600;color:var(--sport);letter-spacing:.02em}
.empty{position:absolute;left:0;right:0;top:40px;text-align:center;color:var(--muted);font-size:13px;pointer-events:none;padding:0 12px}
.empty strong{display:block;font-family:var(--f-display);font-size:16px;color:var(--ink);margin-bottom:2px;font-weight:700}

/* Blocks */
.block{--c:var(--study);position:relative;color:#fff;border:0;border-radius:10px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 88%,#fff),var(--c));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px rgba(15,20,35,.14),0 6px 14px -8px color-mix(in srgb,var(--c) 80%,transparent);
  touch-action:none;user-select:none;-webkit-user-select:none;text-align:left;font-weight:600}
.block::before{content:"";position:absolute;left:6px;top:50%;width:6px;height:12px;transform:translateY(-50%);
  background-image:radial-gradient(rgba(255,255,255,.65) 1px,transparent 1.4px);background-size:3px 4px;opacity:.9}
.cat-study{--c:var(--study)} .cat-sport{--c:var(--sport)} .cat-play{--c:var(--play)} .cat-life{--c:var(--life)}
.sw-study{background:var(--study)} .sw-sport{background:var(--sport)} .sw-play{background:var(--play)} .sw-life{background:var(--life)}
.placed{position:absolute;left:3px;right:3px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 4px 2px 18px;cursor:grab;overflow:hidden}
.placed .left{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.placed .name{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.placed .when{font-size:10.5px;font-weight:500;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
.placed.tight .when{display:none}
.placed .ctl{display:flex;gap:3px;flex-shrink:0}
.placed .ctl button{height:22px;min-width:22px;border-radius:6px;border:0;background:rgba(255,255,255,.2);color:#fff;font-weight:600;font-size:11px;line-height:22px;padding:0 5px}
.placed .ctl button:hover{background:rgba(255,255,255,.32)}
.placed.dragging{opacity:.25}

/* Tray */
.tray{padding:12px;gap:12px;overflow-y:auto}
.tray h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cat{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;border-radius:10px;padding:6px 8px;font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;line-height:1.1}
.cat i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cat[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--bg)}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:4px 0;font-weight:600;font-size:12px;color:var(--muted);border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(15,20,35,.12)}
.stack{display:flex;flex-direction:column;gap:6px}
.list{display:flex;flex-direction:column;gap:7px}
.tblock{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:9px 8px 9px 18px;font-size:13.5px;line-height:1.15;cursor:grab}
.tblock .nm{min-width:0;overflow-wrap:anywhere}
.tblock .min{font-size:10.5px;font-weight:600;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 7px;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
.tblock.selected{outline:2px solid var(--ink);outline-offset:2px}
.tblock .del{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.25);color:#fff;border:0;font-size:13px;line-height:22px;padding:0;flex-shrink:0}
.hint{font-size:11.5px;color:var(--muted);margin:0}
.tray-foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.maker{display:flex;flex-direction:column;gap:8px}
.maker input{font:inherit;width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}

.ghost{position:fixed!important;z-index:50;pointer-events:none;transform:scale(1.02);box-shadow:0 18px 34px -10px rgba(15,20,35,.4)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:7px 14px;border-radius:999px;font-weight:600;z-index:60;font-size:13px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="eyebrow">Weekly plan</span><h1>After-School Planner</h1></div>
    <div class="savebar">
      <span class="status" id="status"></span>
      <button class="btn primary" id="saveBtn" type="button">Save</button>
    </div>
  </header>

  <div class="dayrow">
    <nav class="days" id="days" aria-label="Day of the week"></nav>
    <div class="tools">
      <button class="btn ghosty" id="copyBtn" type="button">Copy to weekdays</button>
      <button class="btn ghosty" id="clearBtn" type="button">Clear</button>
    </div>
  </div>

  <div class="main">
    <section class="panel" aria-label="Schedule">
      <div class="board-head">
        <div class="dtitle"><h2 id="dayTitle">Monday</h2><span class="range" id="range"></span></div>
        <div class="meter" id="meter"></div>
        <div class="mtext" id="mtext"></div>
      </div>
      <div class="pane" id="pane">
        <div class="timeline">
          <div class="times" id="times"></div>
          <div class="track" id="track"></div>
        </div>
      </div>
    </section>

    <aside class="panel tray" id="tray" aria-label="Blocks">
      <h3>Blocks</h3>
      <div class="cats" id="cats" role="group" aria-label="Category"></div>
      <div id="trayBody" class="stack" style="gap:12px;flex:1"></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const UNIT = 15;
const RANGES = { weekday:{start:16*60+30,end:21*60+15}, weekend:{start:9*60,end:22*60} };
const CATS = {study:"Learning", sport:"Sports", play:"Play & Relax", life:"Routine"};
const DAYS = [["mon","Mon","Monday"],["tue","Tue","Tuesday"],["wed","Wed","Wednesday"],["thu","Thu","Thursday"],["fri","Fri","Friday"],["sat","Sat","Saturday"],["sun","Sun","Sunday"]];
const WEEKEND = new Set(["sat","sun"]);
// len in 15-min units: 2 = 30 min, 4 = 60 min. flex = can be 30 or 60.
const DEFAULT_LIB = [
  {id:"math",name:"Math",cat:"study",len:2,flex:true},
  {id:"beast",name:"Beast Academy",cat:"study",len:2,flex:true},
  {id:"writing",name:"Writing",cat:"study",len:2,flex:true},
  {id:"science",name:"Science",cat:"study",len:2,flex:true},
  {id:"mth",name:"Magic Tree House",cat:"study",len:2,flex:false},
  {id:"baseball",name:"Baseball",cat:"sport",len:4,flex:true},
  {id:"free",name:"Free Time",cat:"play",len:2,flex:true},
  {id:"lunch",name:"Lunch",cat:"life",len:4,flex:false},
  {id:"dinner",name:"Dinner",cat:"life",len:4,flex:false},
  {id:"shower",name:"Shower",cat:"life",len:2,flex:false}
];
const KEY = "planner_v3", DOC = "planner/v3";

const uid = () => Math.random().toString(36).slice(2,9);
let state = {lib:DEFAULT_LIB.map(a=>({...a})), days:{}};
DAYS.forEach(([k])=>state.days[k]=[]);
const today = ["sun","mon","tue","wed","thu","fri","sat"][new Date().getDay()];
let cur=today, dirty=false, selected=null, tab="study", flexLen=2, mode="blocks", newCat="study", newLen="flex", db=null, copyArm=false;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const R = () => RANGES[WEEKEND.has(cur)?"weekend":"weekday"];
const N = () => (R().end-R().start)/UNIT;
const mins = u => R().start+u*UNIT;
function clock(m){const h=Math.floor(m/60), mm=m%60, h12=((h+11)%12)+1; return h12+(mm?":"+String(mm).padStart(2,"0"):"");}
function ampm(m){return Math.floor(m/60)>=12?"PM":"AM";}
function clockFull(m){const h=Math.floor(m/60), mm=m%60; return ((h+11)%12+1)+":"+String(mm).padStart(2,"0")+" "+ampm(m);}
function dur(m){const h=Math.floor(m/60),r=m%60;return h?(h+"h"+(r?" "+r+"m":"")):r+"m";}
const actLen = a => a.flex ? flexLen : a.len;

function occ(ignore){const n=N(),o=new Array(n).fill(null);state.days[cur].forEach(p=>{if(p.uid===ignore)return;for(let i=p.start;i<p.start+p.len&&i<n;i++)o[i]=p.uid;});return o;}
function fits(s,len,ignore){if(s<0||s+len>N())return false;const o=occ(ignore);for(let i=s;i<s+len;i++)if(o[i])return false;return true;}
function findSpot(s,len,flex,ignore){
  const lens = flex&&len>2 ? [len,2] : [len];
  for(const l of lens) for(const d of [0,-1,1,-2,2]) if(fits(s+d,l,ignore)) return {start:s+d,len:l};
  return null;
}

function setStatus(t,isDirty){const s=$("status");s.textContent=t;s.classList.toggle("dirty",!!isDirty);}
function markDirty(){dirty=true;setStatus("Unsaved changes",true);}
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,1500);}

/* ---------- sizing: weekdays fit the pane, weekends scroll inside it ---------- */
function sizeUnit(){
  const pane=$("pane"); const avail=pane.clientHeight-30;
  const u = Math.max(20, Math.min(34, Math.floor(avail/N())));
  document.documentElement.style.setProperty("--u", u+"px");
}

/* ---------- render ---------- */
function renderDays(){
  $("days").innerHTML = DAYS.map(([k,l])=>`<button class="day${WEEKEND.has(k)?' wkend':''}" type="button" data-day="${k}" aria-pressed="${k===cur}">${l}${state.days[k]?.length?'<span class="dot"></span>':''}</button>`).join("");
  $("copyBtn").textContent = copyArm ? "Tap again to copy" : (WEEKEND.has(cur) ? "Copy to weekend" : "Copy to weekdays");
}
function renderTray(){
  $("cats").innerHTML = Object.keys(CATS).map(c=>`<button type="button" class="cat" data-tab="${c}" aria-pressed="${c===tab&&mode!=='new'}"><i class="sw-${c}"></i>${CATS[c]}</button>`).join("");
  const body=$("trayBody");
  if(mode==="backup"){
    body.innerHTML = `<div class="maker">
      <h3>Backup</h3>
      <p class="hint">Plans are kept on this device. Export a backup file to move them to another phone or computer, then import it there.</p>
      <div class="chips"><button class="btn primary small" type="button" id="exportBtn">Export backup</button>
      <label class="btn small" for="importFile">Import backup</label></div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <div class="chips"><button class="btn small" type="button" data-mode="blocks">Done</button></div>
    </div>`;
    return;
  }
  if(mode==="new"){
    body.innerHTML = `<form class="maker" id="maker" autocomplete="off">
      <h3>New block</h3>
      <input type="text" id="newName" maxlength="20" placeholder="Name, e.g. Piano" aria-label="Block name">
      <div class="chips" role="group" aria-label="Category">${Object.keys(CATS).map(c=>`<button type="button" class="chip" data-ncat="${c}" aria-pressed="${c===newCat}">${CATS[c]}</button>`).join("")}</div>
      <div class="chips" role="group" aria-label="Length">${[["flex","30 or 60 min"],["2","30 min only"],["4","60 min only"]].map(([v,l])=>`<button type="button" class="chip" data-nlen="${v}" aria-pressed="${v===newLen}">${l}</button>`).join("")}</div>
      <div class="chips"><button class="btn primary small" type="submit">Add block</button><button class="btn small" type="button" data-mode="blocks">Cancel</button></div>
    </form>`;
    return;
  }
  const items=state.lib.filter(a=>a.cat===tab), anyFlex=items.some(a=>a.flex);
  body.innerHTML = `
    ${anyFlex?`<div class="seg" role="group" aria-label="Length for flexible blocks"><button type="button" data-flen="2" aria-pressed="${flexLen===2}">30 min</button><button type="button" data-flen="4" aria-pressed="${flexLen===4}">60 min</button></div>`:''}
    <div class="list">${items.length?items.map(a=>`<div class="block tblock cat-${a.cat}${selected===a.id?' selected':''}" role="button" tabindex="0" data-act="${a.id}" aria-label="${esc(a.name)}, ${actLen(a)*UNIT} minutes"><span class="nm">${esc(a.name)}</span>${mode==='manage'?`<button class="del" type="button" data-del="${a.id}" aria-label="Delete ${esc(a.name)}">×</button>`:`<span class="min">${a.flex?actLen(a)*UNIT+' min':'fixed '+a.len*UNIT}</span>`}</div>`).join(""):'<p class="hint">No blocks in this category yet.</p>'}</div>
    <p class="hint">${mode==='manage'?'Tap × to remove a block from the tray.':(selected?'Now tap a time on the schedule.':'Drag a block onto the schedule, or tap it and then tap a time.')}</p>
    <div class="tray-foot"><button class="btn small" type="button" data-mode="new">+ New block</button><button class="btn ghosty small" type="button" data-mode="${mode==='manage'?'blocks':'manage'}">${mode==='manage'?'Done':'Edit'}</button><button class="btn ghosty small" type="button" data-mode="backup">Backup</button></div>`;
}
function renderBoard(){
  sizeUnit();
  const n=N(), r=R();
  $("dayTitle").textContent = DAYS.find(d=>d[0]===cur)[2];
  $("range").textContent = clockFull(r.start)+" – "+clockFull(r.end);
  const tl=[];
  for(let i=0;i<n;i+=2){ const m=mins(i);
    tl.push(m%60===0?`<div class="h" style="top:calc(var(--u) * ${i})">${clock(m)}<small>${ampm(m)}</small></div>`:`<div class="hh" style="top:calc(var(--u) * ${i})">${clock(m)}</div>`); }
  tl.push(`<div class="bed" style="top:calc(var(--u) * ${n})">${clock(r.end)}</div>`);
  $("times").innerHTML=tl.join(""); $("times").style.height=`calc(var(--u) * ${n})`;
  const track=$("track"); track.style.height=`calc(var(--u) * ${n})`;
  const o=occ(), day=state.days[cur];
  track.innerHTML = Array.from({length:n},(_,i)=>{const m=mins(i);return `<button type="button" class="slot${m%60===0?' q60':(m%30===0?' q30':'')}${selected&&!o[i]?' tap':''}" data-slot="${i}" style="top:calc(var(--u) * ${i})" aria-label="${clockFull(m)}" ${o[i]?'tabindex="-1"':''}>${selected&&!o[i]&&m%30===0?'+':''}</button>`;}).join("") +
    `<div class="bedline" style="top:calc(var(--u) * ${n})"></div><span class="bedtag" style="top:calc(var(--u) * ${n})">Bedtime</span>` +
    (day.length?'':`<div class="empty"><strong>An empty ${DAYS.find(d=>d[0]===cur)[2]}</strong>Pick a category on the right and drag blocks in.</div>`) +
    day.map(p=>`<div class="block placed cat-${p.cat}${p.len<=2?' tight':''}" data-uid="${p.uid}" style="top:calc(var(--u) * ${p.start} + 2px);height:calc(var(--u) * ${p.len} - 4px)">
        <div class="left"><span class="name">${esc(p.name)}</span><span class="when">${clock(mins(p.start))} – ${clock(mins(p.start+p.len))} · ${p.len*UNIT} min</span></div>
        <div class="ctl">${p.flex?`<button type="button" data-op="len" aria-label="Switch to ${p.len===2?60:30} minutes">${p.len===2?'60':'30'}</button>`:''}<button type="button" data-op="remove" aria-label="Remove ${esc(p.name)}">×</button></div>
      </div>`).join("");
  const tot={study:0,sport:0,play:0,life:0}; let used=0;
  day.forEach(p=>{tot[p.cat]+=p.len*UNIT;used+=p.len*UNIT;});
  const all=n*UNIT;
  $("meter").innerHTML = Object.keys(CATS).map(c=>tot[c]?`<span class="sw-${c}" style="width:${tot[c]/all*100}%"></span>`:"").join("");
  $("mtext").innerHTML = `<span class="legend">${Object.keys(CATS).filter(c=>tot[c]).map(c=>`<span><i class="sw-${c}"></i>${CATS[c]} <b>${dur(tot[c])}</b></span>`).join("")||'Nothing planned yet'}</span>` +
    (all-used<30?`<span class="done">Fully planned</span>`:`<span><b>${dur(all-used)}</b> open</span>`);
}
function render(){renderDays();renderTray();renderBoard();}

/* ---------- actions ---------- */
function place(actId,s){
  const a=state.lib.find(x=>x.id===actId); if(!a) return false;
  const spot=findSpot(s,actLen(a),a.flex); if(!spot){toast("No room there");return false;}
  state.days[cur].push({uid:uid(),act:a.id,name:a.name,cat:a.cat,flex:a.flex,start:spot.start,len:spot.len});
  state.days[cur].sort((x,y)=>x.start-y.start); markDirty(); return true;
}
function move(u,s){
  const p=state.days[cur].find(x=>x.uid===u); if(!p) return;
  const spot=findSpot(s,p.len,p.flex,u); if(!spot){toast("No room there");return;}
  p.start=spot.start;p.len=spot.len;state.days[cur].sort((x,y)=>x.start-y.start);markDirty();
}

/* ---------- drag (pointer events: mouse + touch) ---------- */
let drag=null;
function slotAt(x,y){
  const tr=$("track").getBoundingClientRect(), pr=$("pane").getBoundingClientRect();
  if(x<pr.left-10||x>pr.right+24||y<pr.top-20||y>pr.bottom+20) return null;
  const top=Math.max(pr.top,Math.min(pr.bottom,y))-drag.oy;
  return Math.max(0,Math.min(N()-1,Math.round((top-tr.top)/(tr.height/N()))));
}
function clearHl(){document.querySelectorAll(".slot.hl,.slot.bad").forEach(s=>s.classList.remove("hl","bad"));}
function updateTarget(){
  clearHl(); drag.slot=slotAt(drag.x,drag.y); if(drag.slot==null) return;
  const slots=document.querySelectorAll(".slot"), spot=findSpot(drag.slot,drag.len,drag.flex,drag.uid);
  if(!spot){slots[drag.slot]&&slots[drag.slot].classList.add("bad");return;}
  for(let i=spot.start;i<spot.start+spot.len;i++)slots[i].classList.add("hl");
}
function autoScroll(){
  if(!drag||!drag.started) return;
  const pane=$("pane"), pr=pane.getBoundingClientRect(), edge=48;
  if(drag.x>pr.left-10&&drag.x<pr.right+24){
    let dy=0;
    if(drag.y<pr.top+edge) dy=-Math.ceil((pr.top+edge-drag.y)/6);
    else if(drag.y>pr.bottom-edge) dy=Math.ceil((drag.y-(pr.bottom-edge))/6);
    if(dy){pane.scrollTop+=Math.max(-14,Math.min(14,dy));updateTarget();}
  }
  requestAnimationFrame(autoScroll);
}
document.addEventListener("pointerdown",e=>{
  if(e.button>0||e.target.closest(".ctl button,.del")) return;
  const b=e.target.closest(".block"); if(!b) return;
  const r=b.getBoundingClientRect();
  drag={el:b,act:b.dataset.act||null,uid:b.dataset.uid||null,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,started:false,id:e.pointerId};
});
document.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.id) return;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6) return;
    drag.started=true;
    const tr=$("track").getBoundingClientRect(), uh=tr.height/N();
    let g;
    if(drag.act){
      const a=state.lib.find(x=>x.id===drag.act); drag.len=actLen(a); drag.flex=a.flex;
      g=document.createElement("div"); g.className=`block placed cat-${a.cat}${drag.len<=2?' tight':''}`;
      g.innerHTML=`<div class="left"><span class="name">${esc(a.name)}</span><span class="when">${drag.len*UNIT} min</span></div>`;
      g.style.width=(tr.width-6)+"px"; g.style.height=(drag.len*uh-4)+"px";
      drag.ox=Math.min(tr.width/3,48); drag.oy=Math.min(16,(drag.len*uh-4)/2);
    } else {
      const p=state.days[cur].find(x=>x.uid===drag.uid); drag.len=p.len; drag.flex=p.flex;
      g=drag.el.cloneNode(true); g.querySelector(".ctl")?.remove();
      g.style.width=drag.el.offsetWidth+"px"; g.style.height=drag.el.offsetHeight+"px"; drag.el.classList.add("dragging");
    }
    g.classList.add("ghost"); g.style.top="0"; document.body.appendChild(g); drag.ghost=g;
    if(selected){selected=null;document.querySelectorAll(".tblock.selected").forEach(x=>x.classList.remove("selected"));}
    requestAnimationFrame(autoScroll);
  }
  e.preventDefault();
  drag.x=e.clientX; drag.y=e.clientY;
  drag.ghost.style.left=(e.clientX-drag.ox)+"px"; drag.ghost.style.top=(e.clientY-drag.oy)+"px";
  updateTarget();
},{passive:false});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id) return;
  const d=drag; drag=null;
  if(!d.started){ if(d.act){selected=selected===d.act?null:d.act;renderTray();renderBoard();} return; }
  d.ghost.remove(); clearHl(); d.el.classList.remove("dragging");
  if(!cancel){
    if(d.act){ if(d.slot!=null) place(d.act,d.slot); }
    else if(d.slot==null){ state.days[cur]=state.days[cur].filter(p=>p.uid!==d.uid); markDirty(); toast("Removed"); }
    else move(d.uid,d.slot);
  }
  const st=$("pane").scrollTop; render(); $("pane").scrollTop=st;
}
document.addEventListener("pointerup",e=>endDrag(e,false));
document.addEventListener("pointercancel",e=>endDrag(e,true));

/* ---------- clicks ---------- */
document.addEventListener("click",e=>{
  const q=s=>e.target.closest(s); let el;
  if(el=q(".day")){cur=el.dataset.day;copyArm=false;selected=null;render();$("pane").scrollTop=0;return;}
  if(el=q("[data-tab]")){tab=el.dataset.tab;if(mode==="new")mode="blocks";renderTray();return;}
  if(el=q("[data-flen]")){flexLen=+el.dataset.flen;renderTray();return;}
  if(el=q("[data-mode]")){mode=el.dataset.mode;if(mode==="new")newCat=tab;renderTray();if(mode==="new")$("newName").focus();return;}
  if(el=q("[data-ncat]")){newCat=el.dataset.ncat;const v=$("newName").value;renderTray();$("newName").value=v;return;}
  if(el=q("[data-nlen]")){newLen=el.dataset.nlen;const v=$("newName").value;renderTray();$("newName").value=v;return;}
  if(el=q("[data-del]")){state.lib=state.lib.filter(a=>a.id!==el.dataset.del);if(selected===el.dataset.del)selected=null;markDirty();renderTray();return;}
  if(el=q("[data-op]")){
    const u=el.closest(".placed").dataset.uid, p=state.days[cur].find(x=>x.uid===u);
    if(el.dataset.op==="remove") state.days[cur]=state.days[cur].filter(x=>x.uid!==u);
    else if(p.len===2){ if(fits(p.start,4,u)) p.len=4; else if(fits(p.start-2,4,u)){p.start-=2;p.len=4;} else {toast("Not enough room for 60 min");return;} }
    else p.len=2;
    markDirty();const st=$("pane").scrollTop;renderBoard();renderDays();$("pane").scrollTop=st;return;
  }
  if((el=q(".slot"))&&selected){ if(place(selected,+el.dataset.slot)){const st=$("pane").scrollTop;render();$("pane").scrollTop=st;} return; }
});
document.addEventListener("keydown",e=>{
  const b=e.target.closest&&e.target.closest(".tblock");
  if(b&&(e.key==="Enter"||e.key===" ")){e.preventDefault();selected=selected===b.dataset.act?null:b.dataset.act;render();
    document.querySelector(`.tblock[data-act="${b.dataset.act}"]`)?.focus();}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="maker") return; e.preventDefault();
  const name=$("newName").value.trim(); if(!name){toast("Give the block a name");$("newName").focus();return;}
  state.lib.push({id:"c"+uid(),name,cat:newCat,len:newLen==="4"?4:2,flex:newLen==="flex"});
  tab=newCat; mode="blocks"; markDirty(); renderTray(); toast(name+" added");
});
$("clearBtn").onclick=()=>{state.days[cur]=[];markDirty();render();toast("Cleared");};
$("copyBtn").onclick=()=>{
  if(!copyArm){copyArm=true;renderDays();return;}
  copyArm=false;
  const group = WEEKEND.has(cur)?["sat","sun"]:["mon","tue","wed","thu","fri"];
  group.forEach(k=>{if(k!==cur)state.days[k]=state.days[cur].map(p=>({...p,uid:uid()}));});
  markDirty();render();toast(WEEKEND.has(cur)?"Copied to Sat & Sun":"Copied to Mon–Fri");
};
addEventListener("resize",()=>{clearTimeout(sizeUnit._t);sizeUnit._t=setTimeout(renderBoard,120);});

/* ---------- save / load (this device) ---------- */
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){setStatus("Could not save on this device",true);return;}
  dirty=false; setStatus("Saved"); toast("Saved");
}
$("saveBtn").onclick=save;
function adopt(d){
  if(!d||!d.days) return false;
  if(Array.isArray(d.lib)&&d.lib.length) state.lib=d.lib;
  DAYS.forEach(([k])=>state.days[k]=Array.isArray(d.days[k])?d.days[k]:[]);
  return true;
}
try{const raw=localStorage.getItem(KEY); if(raw) adopt(JSON.parse(raw));}catch(e){}
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue="";}});
document.addEventListener("click",e=>{
  if(e.target.id!=="exportBtn") return;
  const blob=new Blob([JSON.stringify({app:"after-school-planner",version:3,exportedAt:new Date().toISOString(),lib:state.lib,days:state.days},null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="planner-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast("Backup exported");
});
document.addEventListener("change",e=>{
  if(e.target.id!=="importFile"||!e.target.files[0]) return;
  const r=new FileReader();
  r.onload=()=>{ try{ if(adopt(JSON.parse(r.result))){ save(); mode="blocks"; render(); toast("Backup imported"); } else toast("That file isn't a planner backup"); }catch(err){ toast("That file isn't a planner backup"); } };
  r.readAsText(e.target.files[0]);
});
render();
if("serviceWorker" in navigator){ addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
})();
</script>
</body>
